<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" role="img" aria-labelledby="title desc">
  <title id="title">NumisRoma wordmark to NR monogram transition</title>
  <desc id="desc">The Cormorant Garamond NumisRoma wordmark resolves as its matching NR monogram.</desc>
  <style>
    .wordmark { animation: wordmark 6s cubic-bezier(.55,0,.2,1) infinite; transform-origin: 300px 70px; }
    .numis { animation: numis 6s cubic-bezier(.55,0,.2,1) infinite; }
    .roma { animation: roma 6s cubic-bezier(.55,0,.2,1) infinite; }
    .seal { animation: seal 6s cubic-bezier(.3,.75,.2,1) infinite; transform-origin: 120px 120px; }
    .thread { animation: thread 6s ease-in-out infinite; stroke-dasharray: 28 54; }
    .monogram-glyphs { display: none; }
    @keyframes wordmark { 0%,37% { opacity:1; transform:scale(1); } 59%,88% { opacity:0; transform:scale(.9); } 100% { opacity:1; transform:scale(1); } }
    @keyframes numis { 0%,37% { transform:translateX(0); } 59%,88% { transform:translateX(82px); } 100% { transform:translateX(0); } }
    @keyframes roma { 0%,37% { transform:translateX(0); } 59%,88% { transform:translateX(-82px); } 100% { transform:translateX(0); } }
    @keyframes seal { 0%,40% { opacity:0; transform:scale(.88); } 62%,88% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.88); } }
    @keyframes thread { 0%,38%,100% { opacity:0; stroke-dashoffset:82; } 47%,58% { opacity:1; stroke-dashoffset:0; } 67%,88% { opacity:0; stroke-dashoffset:-82; } }
    @media (prefers-reduced-motion: reduce) { .wordmark,.numis,.roma,.seal,.thread { animation:none; } .wordmark,.thread { opacity:0; } .seal { opacity:1; transform:scale(1); } }
  </style>
