services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        - NEXT_PUBLIC_KOFI_URL=${NEXT_PUBLIC_KOFI_URL:-https://ko-fi.com/numisroma}
        - NEXT_PUBLIC_KOFI_USERNAME=${NEXT_PUBLIC_KOFI_USERNAME:-numisroma}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      # Authenticated connection string built from the same credentials mongo is booted with.
      # authSource=admin because the root user lives in the admin DB.
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}:${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}@mongodb:27017/numisroma?authSource=admin
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - TRUST_PROXY=1
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      - CSRF_SECRET=${CSRF_SECRET:?CSRF_SECRET is required}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:4000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:?RESEND_API_KEY is required}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-NumisRoma <noreply@numisroma.com>}
      - RESEND_REPLY_TO_EMAIL=${RESEND_REPLY_TO_EMAIL:-${SUPPORT_EMAIL:-support@numisroma.com}}
      - EMAIL_LOGO_URL=${EMAIL_LOGO_URL:-}
      - EMAIL_DMARC_CONFIRMED=${EMAIL_DMARC_CONFIRMED:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-support@numisroma.com}
      - ABSTRACT_EMAIL_API_KEY=${ABSTRACT_EMAIL_API_KEY:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - GOOGLE_VISION_API_KEY=${GOOGLE_VISION_API_KEY:-}
      - MAXMIND_CITY_DB_PATH=${MAXMIND_CITY_DB_PATH:-/usr/src/app/geoip/GeoLite2-City.mmdb}
      - MAXMIND_ASN_DB_PATH=${MAXMIND_ASN_DB_PATH:-/usr/src/app/geoip/GeoLite2-ASN.mmdb}
      - MAXMIND_ISP_DB_PATH=${MAXMIND_ISP_DB_PATH:-}
      - MAXMIND_ANONYMOUS_IP_DB_PATH=${MAXMIND_ANONYMOUS_IP_DB_PATH:-}
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY:-15m}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-7d}
      - ROTATE_REFRESH_TOKENS=${ROTATE_REFRESH_TOKENS:-true}
      - SESSION_IDLE_TIMEOUT=${SESSION_IDLE_TIMEOUT:-30m}
      - SESSION_ABSOLUTE_TIMEOUT=${SESSION_ABSOLUTE_TIMEOUT:-7d}
      - SESSION_REMEMBER_ME_TIMEOUT=${SESSION_REMEMBER_ME_TIMEOUT:-30d}
      - SESSION_AUDIT_RETENTION_DAYS=${SESSION_AUDIT_RETENTION_DAYS:-365}
    volumes:
      - ${MAXMIND_DATA_DIR:-./geoip}:/usr/src/app/geoip:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    ports:
      - "27018:27017"
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  geoipupdate:
    image: maxmindinc/geoipupdate:latest
    profiles:
      - geoip
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID:-}
      - GEOIPUPDATE_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      - GEOIPUPDATE_EDITION_IDS=${MAXMIND_EDITION_IDS:-GeoLite2-City GeoLite2-ASN}
      - GEOIPUPDATE_FREQUENCY=${MAXMIND_UPDATE_FREQUENCY_HOURS:-24}
    volumes:
      - ${MAXMIND_DATA_DIR:-./geoip}:/usr/share/GeoIP
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
